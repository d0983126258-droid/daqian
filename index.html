<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>大千世界</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=Ma+Shan+Zheng&display=swap">
<style>
/* Layout: field-journal pages on a desk. Sticky HUD strip, journal-tab nav, paper cards, ink-sketch scene banner, stamp toasts. */
:root{--desk:#c4cbb3;--paper:#eef0e0;--paper2:#e1e5cc;--ink:#26303a;--mute:#5f6a58;--leaf:#2f7050;--leaf-ink:#f4f7ea;--stamp:#a83f2d;--gold:#8f6a12;--line:#b9bd9f;
--c:#4f5a63;--u:#2f7050;--r:#2a5f9a;--e:#7a46a3;--m:#a85a14;--x:#a83f2d;
--display:"Noto Serif TC","Songti TC",serif;--hand:"Ma Shan Zheng","Noto Serif TC",cursive;--body:"Noto Sans TC","PingFang TC",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--desk:#0f1411;--paper:#1c2420;--paper2:#26302a;--ink:#e6eAD6;--mute:#98a48d;--leaf:#8cc9a2;--leaf-ink:#12201a;--stamp:#e48a74;--gold:#dcb85e;--line:#38443b;--c:#b4bfb0;--u:#8fd0a8;--r:#86b4f0;--e:#c9a0f0;--m:#f0b070;--x:#f08a80;color-scheme:dark}}
:root[data-theme="dark"]{--desk:#0f1411;--paper:#1c2420;--paper2:#26302a;--ink:#e6eAD6;--mute:#98a48d;--leaf:#8cc9a2;--leaf-ink:#12201a;--stamp:#e48a74;--gold:#dcb85e;--line:#38443b;--c:#b4bfb0;--u:#8fd0a8;--r:#86b4f0;--e:#c9a0f0;--m:#f0b070;--x:#f08a80;color-scheme:dark}
*{box-sizing:border-box}
html{background:var(--desk)}
body{background:var(--desk);color:var(--ink);font:15px/1.7 var(--body);padding-block:0 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;color:var(--ink)}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;padding:10px 14px 10px;margin-bottom:14px;box-shadow:0 2px 0 var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.hud .row{display:flex;gap:4px 14px;flex-wrap:wrap;align-items:baseline;justify-content:space-between}
.brand{font-family:var(--hand);font-size:26px;letter-spacing:.1em;color:var(--stamp);line-height:1.2}
.pos{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;margin-top:6px}
.bar{min-width:0}.bar small{display:flex;justify-content:space-between;color:var(--mute);font-size:12px;font-variant-numeric:tabular-nums}
.bar i{display:block;height:7px;border:1px solid var(--line);background:var(--paper2);border-radius:4px;overflow:hidden;margin-top:2px}
.bar b{display:block;height:100%;background:var(--leaf)}.bar.x b{background:var(--gold)}.bar.low b{background:var(--stamp)}
.stats{display:flex;gap:2px 14px;flex-wrap:wrap;margin-top:6px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.stats b{color:var(--ink);font-weight:700}
nav{display:flex;gap:6px;margin-bottom:0;padding-left:4px}
nav button{background:var(--paper2);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;color:var(--mute);padding:7px 16px;font:inherit;cursor:pointer;margin-bottom:-1px;position:relative;top:1px}
nav button.on{background:var(--paper);color:var(--ink);font-weight:700;z-index:1}
main{background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:14px;min-height:60vh}
.card{background:var(--paper2);border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:12px}
.card h2{font-size:19px;margin-bottom:2px}.card h3{font-size:16px;margin-bottom:6px}
.sub{color:var(--mute);font-size:13px;margin:0 0 10px;line-height:1.6}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.btn{font:inherit;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:9px 12px;cursor:pointer;text-align:left;min-width:0;box-shadow:2px 2px 0 var(--line);transition:transform .08s}
.btn:hover:not(:disabled){border-color:var(--leaf);color:var(--leaf)}
.btn:active:not(:disabled){transform:translate(1px,1px);box-shadow:1px 1px 0 var(--line)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;border-style:dashed}
.btn small{display:block;color:var(--mute);font-size:12px;line-height:1.5}
.btn.pri{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}.btn.pri small{color:inherit;opacity:.85}.btn.pri:hover:not(:disabled){color:var(--leaf-ink);filter:brightness(1.08)}
.btn.warn{border-color:var(--stamp);color:var(--stamp)}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:7px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border:0}.item>span{min-width:0;flex:1 1 150px}
.item .acts{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto}.item .btn{padding:3px 10px;font-size:13px;box-shadow:none}
.tag{display:inline-block;font-size:11px;padding:0 6px;border-radius:2px;border:1px solid var(--line);color:var(--mute);margin-left:4px;line-height:1.6}
.r-c{color:var(--c)}.r-u{color:var(--u)}.r-r{color:var(--r)}.r-e{color:var(--e)}.r-m{color:var(--m)}.r-x{color:var(--x)}
.scene{position:relative;border:1px solid var(--ink);border-radius:3px;overflow:hidden;margin-bottom:12px;box-shadow:3px 3px 0 var(--line)}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:300/120;max-height:210px}
.scene .cap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:14px 10px 6px;color:#fff;font-size:12px;background:linear-gradient(transparent,#000a);text-shadow:0 1px 2px #000}
.scene .cap b{font-family:var(--hand);font-size:20px;font-weight:400;letter-spacing:.06em}
.log{font-size:14px;display:flex;flex-direction:column;gap:2px;font-family:var(--hand);font-size:16px;line-height:1.6}.log p{margin:0;color:var(--mute)}.log p:first-child{color:var(--ink)}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.dc{position:relative;background:var(--paper);border:1px solid var(--ink);border-radius:2px;padding:14px 10px 10px;min-width:0;box-shadow:2px 2px 0 var(--line)}
.dc::before{content:"";position:absolute;top:-6px;left:50%;width:42px;height:12px;margin-left:-21px;background:var(--line);opacity:.8;transform:rotate(-2deg)}
.dc.lock{border-style:dashed;box-shadow:none;background:transparent}.dc.lock b{color:var(--mute)}
.dc b{font-family:var(--display);font-size:16px}.dc .dp{margin:4px 0 0;font-size:12px;color:var(--mute);line-height:1.55}
.dc{font:inherit;color:var(--ink);text-align:left;cursor:pointer;display:block;width:100%}.dc:hover:not(.lock){border-color:var(--leaf)}.dc:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.sheet.dtl{text-align:left;max-width:460px;max-height:86vh;overflow:auto;border-color:var(--ink)}.dtl h2{font-family:var(--display);font-size:26px;letter-spacing:.04em}
.dtl h2.r-c{color:var(--c)}.dtl h2.r-u{color:var(--u)}.dtl h2.r-r{color:var(--r)}.dtl h2.r-e{color:var(--e)}.dtl h2.r-m{color:var(--m)}.dtl h2.r-x{color:var(--x)}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:14px}dt{color:var(--mute);font-size:13px;white-space:nowrap}dd{margin:0;min-width:0}.rd{margin:0}
.no{display:block;font-size:11px;letter-spacing:.12em;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.chips .btn{padding:2px 10px;font-size:13px;box-shadow:none}.chips .btn.on{border-color:var(--leaf);color:var(--leaf);font-weight:700}
.alert{border-color:var(--stamp);border-width:2px}
.plot{border:1px dashed var(--ink);border-radius:3px;padding:8px;font-size:13px;min-height:64px;background:var(--paper)}
ul.rules{padding-left:18px;margin:6px 0}ul.rules li{margin:5px 0}
.mute{color:var(--mute)}
#toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:15;padding:0 16px}
.toast{background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:6px 14px;font-size:14px;box-shadow:3px 3px 0 var(--line);max-width:min(520px,100%);animation:in .25s ease-out}
.toast.dex{border:2px solid var(--stamp);color:var(--stamp);font-family:var(--hand);font-size:20px;transform:rotate(-1.5deg);letter-spacing:.06em}
.toast.lv,.toast.sp{border:2px solid var(--gold);font-weight:700}
.toast.gain{color:var(--leaf)}
.toast.out{opacity:0;transition:opacity .5s}
#cut:has(.title){background:#000e}
#cut .title{text-align:center;padding:44px 20px 28px;max-width:420px;width:100%}
.title h1{font-family:var(--hand);font-size:clamp(46px,16vw,76px);letter-spacing:.1em;white-space:nowrap;margin:10px 0 6px;color:var(--ink);line-height:1.1}
.title .tsub{letter-spacing:.4em;color:var(--stamp);font-size:14px}
.title .tline{height:2px;width:60%;margin:8px auto 18px;background:var(--stamp);opacity:.6}
.title .tdesc{color:var(--mute);line-height:1.9;margin:0 0 26px}
.title .tver{margin-top:18px;font-size:11px;color:var(--mute)}
@keyframes mtb{from{width:100%}to{width:0}}
.mtbar i{background:var(--stamp);animation:mtb var(--d,2s) linear forwards;width:100%}
.mtwarn{font-size:20px;font-weight:700;margin:6px 0;color:var(--stamp)}
body.fog #hud,body.fog #nav,body.fog #toasts,body.fog #main>*:not(.fogcard){filter:blur(6px);transition:filter .4s}
.fogcard{background:linear-gradient(#f4f6f8,#dfe5ea)!important;color:#2b3036}
.fogtxt{filter:blur(4px)}
#fx .blk{position:absolute;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;animation:blkio 2.1s ease-in-out forwards}
#fx .blk b{font:400 clamp(54px,18vw,92px)/1.1 var(--hand);color:#e8d9c0;letter-spacing:.12em;opacity:0;text-shadow:0 0 22px #8a5a2b;animation:rumb .9s ease-out forwards}
#fx .blk .b2{animation-delay:.9s;font-size:clamp(64px,22vw,112px);color:#f0b070}
@keyframes blkio{0%{opacity:0}12%{opacity:1}88%{opacity:1}100%{opacity:0}}
@keyframes rumb{0%{opacity:0;transform:scale(.4)}25%{opacity:1;transform:scale(1.3) translate(-8px,5px)}40%{transform:scale(1.15) translate(8px,-5px)}55%{transform:scale(1.22) translate(-5px,3px)}100%{opacity:1;transform:scale(1)}}
.qbar{position:relative;height:52px;border-radius:10px;background:#cdd5db;overflow:hidden;border:2px solid #2b3036}
.qz{position:absolute;top:0;bottom:0;background:#2f9a5fcc;border-left:2px solid #1f7a45;border-right:2px solid #1f7a45}
.qz.fk{background:#6fc59a55;border-color:#6fc59a88}
.qmk{position:absolute;top:-4px;bottom:-4px;width:8px;margin-left:-4px;background:#2b3036;border-radius:4px;left:0}
.qmist{position:absolute;inset:-14px;pointer-events:none;opacity:0;filter:blur(7px);background:radial-gradient(ellipse at 22% 50%,#fffffff2 0,#fff0 62%),radial-gradient(ellipse at 52% 45%,#ffffffee 0,#fff0 58%),radial-gradient(ellipse at 82% 55%,#fffffff2 0,#fff0 62%)}
body.fog #hud,body.fog #nav,body.fog #toasts,body.fog #main>*:not(.fogcard){filter:blur(7px);transition:filter .5s}
#fogveil{position:fixed;inset:0;background:#fff;z-index:30;pointer-events:none;opacity:0}
body.quake #hud,body.quake #nav,body.quake #main:not(.shake):not(.bigshake){animation:qk .22s linear infinite}
@keyframes qk{0%{transform:translate(0,0)}20%{transform:translate(calc(var(--qa,4px)*-1),calc(var(--qa,4px)*.6))}40%{transform:translate(var(--qa,4px),calc(var(--qa,4px)*-.5))}60%{transform:translate(calc(var(--qa,4px)*-.7),calc(var(--qa,4px)*-.6))}80%{transform:translate(calc(var(--qa,4px)*.8),calc(var(--qa,4px)*.4))}100%{transform:translate(0,0)}}
@media (prefers-reduced-motion:reduce){body.quake #hud,body.quake #nav,body.quake #main{animation:none!important}}
#blinkv{position:fixed;inset:0;background:#000;z-index:40;pointer-events:none;opacity:0;transition:opacity .1s}
#fx .blk.bat b{font-size:clamp(46px,15vw,78px);letter-spacing:.05em;color:#cfe9ff;text-shadow:0 0 22px #3a7fb5}#fx .blk.bat .b2{color:#9fd0ff;font-size:clamp(46px,15vw,78px)}
#fx .sq{position:absolute;left:0;right:0;top:32%;text-align:center;font:400 clamp(40px,12vw,58px)/1.2 var(--hand);color:#ff3b30;letter-spacing:.04em;text-shadow:0 0 20px #000,0 0 40px #a00;animation:sqa .95s ease-out forwards}
@keyframes sqa{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}60%{opacity:1}100%{opacity:0;transform:scale(1)}}
#sonar{position:fixed;left:50%;top:48%;width:0;height:0;z-index:35;pointer-events:none}
#sonar i{position:absolute;left:-10px;top:-10px;width:20px;height:20px;border-radius:50%;border:3px solid #9fd0ff;box-shadow:0 0 14px #3a7fb5;opacity:0;animation:snr .95s ease-out forwards}
#sonar i:nth-child(2){animation-delay:.18s}#sonar i:nth-child(3){animation-delay:.36s}
@keyframes snr{0%{transform:scale(1);opacity:.9}100%{transform:scale(26);opacity:0}}
#over[hidden],#cut[hidden]{display:none!important}
#over,#cut{position:fixed;inset:0;display:grid;place-items:center;background:#000a;z-index:20;padding:16px}
.sheet{max-width:420px;border:2px solid var(--stamp);background:var(--paper);text-align:center;padding:20px}
.sheet h2{font-family:var(--hand);font-size:34px;color:var(--stamp);font-weight:400;letter-spacing:.1em}
@keyframes met{from{stroke-dashoffset:60;opacity:1;transform:translate(40px,-30px)}to{stroke-dashoffset:-60;opacity:0;transform:translate(-20px,15px)}}
.meteor{stroke-dasharray:60;animation:met 1.2s ease-out both}
.tugbar{height:16px;border:1px solid var(--ink);border-radius:8px;background:var(--paper);overflow:hidden;margin:8px 0}.tugbar i{display:block;height:100%;background:var(--leaf);width:0}.tugbar.t i{background:var(--stamp);width:100%;transform-origin:left;animation:shrink 5s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.big{width:100%;text-align:center;font-size:20px;padding:18px 12px;touch-action:manipulation;user-select:none}
.dlg{display:flex;gap:12px;align-items:flex-start;margin:4px 0 12px}
.av{flex:0 0 52px;width:52px;height:52px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);display:grid;place-items:center;font-family:var(--hand);font-size:30px;color:var(--stamp)}
.bub{position:relative;flex:1;min-width:0;background:var(--paper);border:1px solid var(--ink);border-radius:3px 14px 14px 14px;padding:8px 14px 10px;box-shadow:3px 3px 0 var(--line)}
.bub::before{content:"";position:absolute;left:-9px;top:12px;border:8px solid transparent;border-left:0;border-right:9px solid var(--ink)}
.bub b{display:block;font-family:var(--display);font-size:13px;color:var(--mute);letter-spacing:.12em}
.bub p{margin:2px 0 0;font-size:15.5px;line-height:1.85}
body.hit::after{content:"";position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 90px 24px rgba(205,45,35,.6);animation:hitf .7s ease-out forwards;z-index:12}
@keyframes hitf{from{opacity:1}to{opacity:0}}
.shake{animation:shk .35s linear}
body.rkw::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:12;box-shadow:inset 0 0 80px 20px rgba(230,120,30,.55);animation:rkp .33s ease-in-out 3}
@keyframes rkp{50%{opacity:.1}}
.bigshake{animation:bshk .55s linear}@keyframes bshk{10%{transform:translate(-9px,5px)}25%{transform:translate(8px,-6px)}40%{transform:translate(-7px,-4px)}55%{transform:translate(6px,5px)}70%{transform:translate(-4px,2px)}85%{transform:translate(3px,-2px)}}
.dmg{font:700 54px/1.2 var(--hand);color:var(--stamp);animation:dmgp .8s ease-out}@keyframes dmgp{0%{transform:scale(2.4);opacity:0}30%{transform:scale(1);opacity:1}}
.dbr{position:absolute;top:-10vh;color:#7d7266;font-size:22px;animation:dbr 1s ease-in forwards}@keyframes dbr{to{transform:translateY(112vh) rotate(220deg)}}@keyframes shk{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.toast.hit{border:2px solid var(--stamp);background:var(--stamp);color:#fff;font-weight:700}
body.mt{--desk:#b89a76;--paper:#f0e2c8;--paper2:#e4d2b0;--ink:#3a2a1c;--mute:#7a6248;--leaf:#8a5a2b;--leaf-ink:#fbf2e0;--stamp:#a83f2d;--gold:#8f6a12;--line:#c9b08a;color-scheme:light}
html:has(body.mt){background:#b89a76}
body.cave{--desk:#050506;--paper:#101114;--paper2:#1a1c20;--ink:#e8e8ee;--mute:#9a9aa6;--leaf:#4f9cc0;--leaf-ink:#04121a;--stamp:#e48a74;--gold:#dcb85e;--line:#2a2c33;--c:#b4b4c0;--u:#8fd0a8;--r:#86b4f0;--e:#c9a0f0;--m:#f0b070;--x:#f08a80;color-scheme:dark}
html:has(body.cave){background:#050506}
body.night{--desk:#0a0f1f;--paper:#151c33;--paper2:#1d2644;--ink:#e3e9f7;--mute:#97a3c4;--leaf:#8fd0b8;--leaf-ink:#0e1a22;--stamp:#ee8f7a;--gold:#e3c46e;--line:#33406a;--c:#b4bfd8;--u:#8fd0a8;--r:#86b4f0;--e:#c9a0f0;--m:#f0b070;--x:#f08a80}
html:has(body.night){background:#0a0f1f}
.hud,main,.card{transition:background-color .7s,border-color .7s,color .7s}
.nightbar{border-color:var(--gold)}
.toast.night{background:#0e1530;color:#e3e9f7;border:2px solid #7f8fd0;font-weight:700}
.ic{display:inline-block;width:1.5em;text-align:center;margin-right:2px;filter:saturate(.85)}
.tile .tn .ic{font-size:18px;margin-right:4px}
.stats span{background:var(--paper2);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.bar i{height:9px}
.bar b{background:linear-gradient(90deg,var(--leaf),#5a9a6c);transition:width .4s}.bar.x b{background:linear-gradient(90deg,var(--gold),#d6b04a)}.bar.low b{background:linear-gradient(90deg,var(--stamp),#d27a5a)}
body{background-image:radial-gradient(circle at 15% 10%,#ffffff40,transparent 40%),radial-gradient(circle at 85% 90%,#0000000d,transparent 45%)}
.card{border-left:3px solid var(--leaf);box-shadow:0 1px 0 #fff6 inset}
.card h2::before{content:'❖ ';color:var(--leaf);font-size:.8em}
body.mt .card{border-left-color:#8a5a2b}body.mt .card h2::before{color:#8a5a2b}
.tile{transition:transform .12s,box-shadow .12s}.tile:hover:not(:disabled){transform:translateY(-2px);box-shadow:2px 4px 0 var(--line)}
.btn{transition:transform .12s,box-shadow .12s,border-color .12s}.btn:hover:not(:disabled){transform:translateY(-1px)}
.cld{animation:cld linear infinite}@keyframes cld{from{transform:translateX(-60px)}to{transform:translateX(340px)}}
.bird{animation:brd 24s linear infinite}.bird.b2{animation-duration:33s;animation-delay:-14s}@keyframes brd{from{transform:translate(-20px,30px)}50%{transform:translate(150px,18px)}to{transform:translate(330px,34px)}}
.ff{animation:ff ease-in-out infinite alternate}@keyframes ff{from{opacity:0;transform:translate(0,0)}to{opacity:1;transform:translate(8px,-9px)}}
.dust{animation:dst linear infinite}@keyframes dst{from{transform:translate(0,-6px)}to{transform:translate(-40px,120px)}}
.glow{animation:glw 3s ease-in-out infinite alternate}@keyframes glw{to{opacity:.08}}
.scene.arr .cap b{animation:arr .7s ease-out}@keyframes arr{from{opacity:0;letter-spacing:.4em;transform:translateY(6px)}}
.scene.arr svg{animation:arrz .9s ease-out}@keyframes arrz{from{filter:brightness(1.6) blur(2px)}}
@media (prefers-reduced-motion:reduce){.cld,.bird,.ff,.dust,.glow,.scene.arr svg,.scene.arr .cap b{animation:none}}
.twk{animation:twk 2.4s ease-in-out infinite alternate}@keyframes twk{to{opacity:.2}}
@media (prefers-reduced-motion:reduce){.twk{animation:none}}
.sec{font-size:12px;letter-spacing:.14em;color:var(--mute);margin:14px 0 6px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{position:relative;font:inherit;text-align:left;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:10px 12px;cursor:pointer;box-shadow:2px 2px 0 var(--line);display:flex;flex-direction:column;gap:2px;min-width:0;touch-action:manipulation}
.tile:hover:not(:disabled){border-color:var(--leaf)}.tile:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tile:disabled{opacity:.5;border-style:dashed;box-shadow:none;cursor:not-allowed}
.tile .tn{font-family:var(--display);font-weight:600;font-size:16px}.tile .ts{font-size:12px;color:var(--mute)}
.tile.go{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}.tile.go .ts{color:inherit;opacity:.85}
.bdg{align-self:flex-start;font-size:11px;padding:0 8px;border-radius:9px;margin-top:4px;border:1px solid var(--leaf);color:var(--leaf);line-height:1.6}
.bdg.warn{border-color:var(--stamp);color:var(--stamp)}.bdg.mute{border-color:var(--line);color:var(--mute)}
.tile.go .bdg{border-color:currentColor;color:inherit}
.lack,.red{color:var(--stamp)}.red{font-weight:700}
.ta{display:block;width:100%;min-height:84px;font:12px/1.4 ui-monospace,Menlo,monospace;background:var(--paper);color:var(--ink);border:1px solid var(--ink);border-radius:3px;padding:6px;resize:vertical;word-break:break-all}
.toast.warn{border:2px solid var(--stamp);color:var(--stamp)}
.warp{position:absolute;inset:0;pointer-events:auto;background:#05060c;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:wpio 1.7s linear forwards}
@keyframes wpio{0%,70%{opacity:1}100%{opacity:0}}
.warp .wv{position:absolute;width:150vmax;height:150vmax;background:conic-gradient(from 0deg,#0000,var(--c1),#0000 25%,var(--c2),#0000 50%,var(--c1),#0000 75%,var(--c2),#0000);opacity:.55;animation:wsp 1.7s cubic-bezier(.3,.6,.4,1) forwards}
@keyframes wsp{from{transform:rotate(0) scale(.2)}to{transform:rotate(540deg) scale(1)}}
.warp .wr{position:absolute;width:30vmin;height:30vmin;border-radius:50%;border:3px solid var(--c2);box-shadow:0 0 30px var(--c1),inset 0 0 30px var(--c1);animation:wrg 1.1s ease-out forwards}
.warp .wr.r2{animation-delay:.25s}
@keyframes wrg{from{transform:scale(.1);opacity:1}to{transform:scale(7);opacity:0}}
.warp .wt{position:relative;text-align:center;color:var(--c2);opacity:0;animation:wtx 1.7s ease-out forwards;text-shadow:0 0 18px var(--c1)}
.warp .wt b{display:block;font:400 clamp(54px,18vw,92px)/1.2 var(--hand);letter-spacing:.2em}.warp .wt small{display:block;font-size:14px;letter-spacing:.3em;opacity:.85}
@keyframes wtx{0%{opacity:0;transform:scale(.7)}20%,75%{opacity:1;transform:scale(1)}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.warp .wv,.warp .wr{animation:none}}
#fx{position:fixed;inset:0;z-index:18;pointer-events:none;overflow:hidden}#fx[hidden]{display:none!important}
#fx .dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 45%,#0000 0,#000c 90%);animation:dimio 5s ease-in-out forwards}#fx .dim.short{animation-duration:3.2s}
@keyframes dimio{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
#fx .mt{position:absolute;left:112%;width:260px;height:3px;border-radius:3px;background:linear-gradient(90deg,#fff0,#fff 85%);filter:drop-shadow(0 0 8px #bfe4ff);opacity:0;animation:fly 1.5s ease-in forwards}
#fx .m1{top:8vh}#fx .m2{top:28vh;width:170px;animation-delay:.25s}#fx .m3{top:2vh;width:120px;animation-delay:.7s}
#fx .mt::after{content:"";position:absolute;right:-4px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:#fff;box-shadow:0 0 12px 6px #bfe4ff}
#fx .big{top:14vh;width:420px;height:4px;animation-delay:.45s;animation-duration:1.9s;filter:drop-shadow(0 0 14px #9fd0ff)}
@keyframes fly{0%{opacity:0;transform:translate(0,0) rotate(148deg)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translate(-150vw,93vw) rotate(148deg)}}
#fx .boom{position:absolute;left:30%;top:70%;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 60px 40px #bfe4ff;opacity:0;animation:boom 1.5s 2.1s ease-out forwards}
@keyframes boom{0%{opacity:0;transform:scale(.2)}20%{opacity:1}100%{opacity:0;transform:scale(7)}}
#fx .mtxt{position:absolute;left:0;right:0;top:36%;text-align:center;color:#fff;text-shadow:0 0 16px #7fb8ff;opacity:0;animation:mtx 3.6s 1.4s forwards;padding:0 16px}
#fx .mtxt.gain{top:40%;animation-delay:.2s;animation-duration:2.8s;text-shadow:0 0 16px #ffd36a}
#fx .mtxt b{display:block;font:400 42px/1.3 var(--hand);letter-spacing:.3em;padding-left:.3em}#fx .mtxt span{font-size:14px;letter-spacing:.1em}#fx .mtxt em{display:block;margin-top:10px;color:#ff6b5e;font-style:normal;font-weight:700;font-size:17px;letter-spacing:.12em;text-shadow:0 0 10px #000}
@keyframes mtx{0%{opacity:0;transform:translateY(12px)}20%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#fx .sp{position:absolute;left:50%;top:46%;width:8px;height:8px;margin:-4px;background:#ffe08a;border-radius:50%;box-shadow:0 0 10px 3px #ffd36a;animation:spark 1.6s ease-out forwards}
@keyframes spark{from{opacity:1;transform:rotate(var(--a)) translateX(0) scale(1.2)}to{opacity:0;transform:rotate(var(--a)) translateX(36vmin) scale(.2)}}
.starbtn{border-color:var(--gold);color:var(--gold);font-weight:700;animation:glow 1.6s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:0 0 0 0 #e3c46e55}to{box-shadow:0 0 14px 3px #e3c46eaa}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pls 1.6s ease-out infinite}@keyframes pls{from{opacity:1;transform:scale(.6)}to{opacity:0;transform:scale(2.4)}}
@media (prefers-reduced-motion:reduce){.starbtn,.pulse{animation:none}}
#fx .ghostdim{background:radial-gradient(circle at 50% 45%,#0000 0,#0a1a3acc 90%);animation-duration:5.4s}
#fx .gh{position:absolute;left:-40%;top:52%;width:34vmin;height:34vmin;border-radius:50%;background:radial-gradient(circle,#e4f2ffcc 0,#9fc8ff66 40%,#0000 70%);filter:blur(4px);animation:ghmove 4.6s ease-in-out forwards}
@keyframes ghmove{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(180vw,-12vh)}}
#fx .gh2{animation-delay:.8s}#fx .mtxt em.calm{color:#bfe0ff;text-shadow:0 0 12px #2a4a9a}
.ghostbar{border-color:#9fc8ff}
.ghg{animation:ghdrift 16s linear infinite}@keyframes ghdrift{from{transform:translateX(-30px)}to{transform:translateX(335px)}}
@media (prefers-reduced-motion:reduce){.ghg{animation:none;transform:translateX(150px)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast,.btn{animation:none;transition:none}}
@media (max-width:480px){.bars{grid-template-columns:1fr}.grid{grid-template-columns:1fr}main{padding:10px}}
[hidden]{display:none!important}
:root{color-scheme:light}
</style>
</head>
<body>
<div class="wrap">
<div class="hud" id="hud"></div>
<nav id="nav"></nav>
<main id="main"></main>
</div>
<div id="toasts" aria-live="polite"></div>
<div id="over" hidden></div>
<div id="cut" hidden></div>
<div id="fx" hidden></div>
<script>

// [id,名稱,分類,稀有度/現象類別,EXP,售價,可攜帶,描述]
const D=[
['echo','回聲草','植物','常見',10,10,1,'整片草地都是。對聲音極敏感，會放大風聲與捕食者吼叫。可做營養品，是神木草質龍的主食。'],
['yuxi','玉璽草','植物','常見',15,15,1,'生於樹蔭下的嫩芽，是日裳樹的幼苗。口感軟嫩，是『玉璽燒』的原料。'],
['lily','破曉百合','植物','珍奇',120,500,1,'僅在破曉時分短暫開花。適合觀賞，微毒不可食用，可提煉麻醉藥。'],
['sun','日裳樹','植物','常見',15,0,0,'萬象森林的主要林相，高大茂密，樹蔭庇護了玉璽草。無法放入背包。'],
['c100','百年苜蓿','植物','稀少',50,1000,1,'生長於大草原，自然生長需百年。回復體力的良藥，也是迷迭兔幼體最愛的食物。'],
['c10k','萬年苜蓿','植物','珍奇',150,4000,1,'生長超過萬年的變異苜蓿，植株巨大散發金光。可回復巨量體力，是神木草質龍的最愛。'],
['frog','碧玉湖蛙','兩棲','常見',15,0,0,'灰色中型蛙類，棲息於湖岸泥沼。皮膚黏液具保濕保水功效（掉落物：湖蛙黏液）。'],
['trout','碧玉艷陽鱒','魚類','稀少',50,200,1,'淡黃色鱗片的大鱒魚。早上出現，晚上看不到。肉質緊實適合做高級料理。'],
['bream','緣氏淡水鯛','魚類','常見',15,60,1,'大前輩「緣貔」命名。生活於碧玉湖下游，數量最多，略帶土腥味。'],
['weaver','草浪織布鳥','鳥類','常見',10,0,0,'體型嬌小成群出現，棲息於日裳樹，會採集回聲草築巢以提早警戒。只能觀察。'],
['eagle','明武熊鷹','鳥類','稀少',40,350,1,'白天出現的巨大飛行捕食者，視力可達兩公里。與牧野禾斑貓是陸地競爭關係。'],
['owl','萬象密林鴞','鳥類','稀少',45,300,1,'夜間中型鳥類，飛行完全無聲，是夜間最強飛行捕食者。羽毛可做高級飾品。'],
['heron','碧玉盜賊鷺','鳥類','常見',25,0,0,'棲息於湖岸，捕食鱒魚與鯛。垂釣時有機率突襲搶魚。只能觀察。'],
['rat','牧野長尾鼠','獸類','常見',10,35,1,'數量龐大。尾巴像回聲草，遇敵會豎尾裝成植物。肉質偏乾，適合野外燒烤。'],
['rabbit','迷迭兔','獸類','常見',20,50,1,'聽覺靈敏，主食為百年苜蓿，排泄物帶迷迭香氣。跟蹤牠可以找到百年苜蓿。'],
['cat','牧野禾斑貓','獸類','稀少',60,200,1,'善於隱藏，夜間遇見機率較高。擅長伏擊與長途追擊，獵人極看好的捕獵夥伴。'],
['wolf','萬象森林狼','獸類','常見',30,100,1,'大型肉食獸，常在綠林道結群徘徊。皮毛可保暖，是新手的斷頭噩夢。'],
['squirrel','緣氏珍珠鼯鼠','獸類','珍奇',180,530,1,'雪白鼯鼠，晝伏夜出。在樹林間靈活變向，逃脫率高達 70%，極為稀少。'],
['wave','回聲草浪','現象','平平',10,0,0,'大風吹過成片回聲草如綠色浪花，會劇烈放大環境風聲。'],
['leap','鱒魚躍龍門','現象','絕美',200,0,0,'早上釣起艷陽鱒的瞬間，反光鱗片猶如地表的第二個太陽。'],
['smoke','狼煙四起','現象','驚駭',150,0,0,'成群的森林狼在綠林道踩踏出鋪天蓋地的煙塵，代表回家的路已被截斷。'],
['quartz','牧野石英','礦物','常見',10,30,1,'生長於綠林道，耐磨石材，石英輕甲的核心材料。'],
['lantern','南瓜燈籠石','礦物','瑰寶',250,700,1,'生長於萬象森林深處，入夜後發出淡藍光芒，可交給工匠加工成高級檯燈。'],
['star','天外星體','礦物','神隱',800,10000,1,'天外墜落的隕星，全界域出現機率最低，隨機墜落各處。黑市天價。'],
['dragon','神木草質龍','龍獸','常見',100,0,0,'體型如移動的小山。偷取龍蛋可帶回販售，但母龍一旦發現會瞬間暴怒。'],
['lion','牧野草原獅亡魂','獸類/鬼怪','幻奇',1000,0,0,'百年前因氣候變遷滅絕的霸主，只有深夜草原上極低機率能見到蒼白幽光的虛影。只能遠觀，無法捕捉，偶爾會發出吼叫。'],
['oxy','解氧石','礦物','常見',15,90,1,'生長於峽之間的土壤中，表面有微小孔洞，內部蘊含氧原子，經特殊處理可提取氧氣。','mt'],
['osseo','屍骨簇','礦物','常見',20,120,1,'生長於動物遺骸上的純白色晶體，數萬年沉澱，已把骨骼成分取代成礦石。硬度尚可，可製成加固裝甲的外骨骼。','mt'],
['obsid','地獄黑曜石','礦物','瑰寶',300,1200,1,'百萬年前火山噴發冷卻後的黑曜石，經岩層擠壓質變成黑紫色。鍛造的黑曜石刀削鐵如泥。','mt'],
['iron','奧古斯精鐵礦','礦物','稀少',80,300,1,'由發現者奧古斯命名的純黑色礦石，強度適中，適合做攀爬鐵鉤。','mt'],
['sapph','洞穴海藍水晶','礦物','瑰寶',350,2000,1,'生長於泉流洞深處富含礦物質的泉水中，接觸紫外線會綻放耀眼藍光。洞中有大鯢棲息，開採困難。','mt'],
['jade','統天寶玉','礦物','幻奇',800,8500,1,'生長於玄脈山頂峰的傳說寶石，據說找到就能成就大業大富大貴。發現並命名者奧古斯就有一顆。','mt'],
['drought','莽原旱魃草','植物','常見',10,20,1,'山界全境都有，柔韌、劇毒、氣味難聞，連殘渣都能再生，甚至長在旱災擬岩鱷的背上。以適應力聞名。','mt'],
['maoc','木茅','植物','常見',10,30,1,'生長於嶽嵒峭，是君主大角羊的主食。根莖粗壯抓地，葉子口感粗硬，可編製成繩索。','mt'],
['juniper','頂點圓柏','植物','瑰寶',200,1200,1,'生長於玄脈山頂峰，數百年才長一顆毬果。種子被絲綢鳥叼走傳播，是極好的園藝植物，但採集環境惡劣。','mt'],
['goat','君主大角羊','獸類','常見',20,200,1,'獨居的中型獸類，頭骨厚度是人界大角羊的兩倍，領地意識強，嗅覺聽覺發達。（售價指掉落物羊角）','mt'],
['dagger','匕首山貓','獸類','稀少',60,420,1,'生活於嶽嵒峭，尾部特化為近 40 公分的骨刃，可切割、揮擊、勾岩壁。擅長伏擊，體力不支時會被獵物君主大角羊反殺。','mt'],
['bat','巨型走地伏翼','獸類','稀少',70,500,1,'生活於泉流洞，前肢粗壯、視覺退化，靠巨大耳朵和嗅覺掌握四周動靜。對探險者來說非常難對付。','mt'],
['vulture','深淵食骨鷲','鳥類','稀少',60,200,1,'盤旋於峽之間上空的巨鳥，主食為動物骨骼。一旦發現下方生物體力不支就會俯衝攻擊，但俯衝失敗會陷入劣勢。','mt'],
['swallow','腐臭高山燕','鳥類','常見',10,50,1,'棲息於嶽嵒峭的小型鳥類，對旱魃草毒素免疫，以其築巢。無法捕捉，只能採集牠們的排泄物，可製成除雜草的農藥。（售價指排泄物）','mt'],
['falcon','兇猛鋼刀隼','鳥類','稀少',40,200,1,'巢穴築於絕壁之上，翼前緣藏有鋒利骨刃，俯衝時化為切割獵物的利刃。連劇毒的峭壁鉤鱗蝮也能消化，是腐臭高山燕的天敵。','mt'],
['silk','玄脈山絲綢鳥','鳥類','珍奇',200,600,1,'生活於玄脈山頂峰，雄鳥擁有如絲綢般的長尾羽，求偶時在高原奔跑跳躍如同舞者。（雄 600、雌 530 界幣）','mt'],
['locust','遠行青蝗','節肢','常見',10,50,1,'以旱魃草為食、自身帶毒的昆蟲，靠強大的飛行力躲避天敵腐臭高山燕。4～5 隻結伴遷徙。——奧古斯','mt'],
['centi','琳琅百足','節肢','稀少',20,500,1,'泉流洞的大型節肢動物，體節上的結晶因螢光細菌而發光。毒牙的毒素像是專門針對巨型走地伏翼設計的。——奧古斯','mt'],
['nail','阿貝拉多釘蟲','節肢','常見',10,10,1,'生活於玄脈山頂峰的灰黑色小蟲，吸食頂點圓柏汁液，刮大風時用腹部尖刺穩住身形。天敵是玄脈山絲綢鳥。','mt'],
['croc','旱災擬岩鱷','爬蟲','稀少',60,1200,1,'潛伏於峽之間泥潭的大型爬蟲，皮膚粗糙如岩石，背上長著旱魃草。被牠埋伏基本上九死一生，下雨天會變得更活躍。（售價指掉落物擬岩鱷皮）','mt'],
['skink','地脈石龍子','爬蟲','稀少',30,200,1,'生活於嶽嵒峭的小型爬蟲，擅長遁地，能感受大地的震動。是匕首山貓的食物之一，流線型鱗片讓牠極易逃脫。','mt'],
['gecko','泰坦錘尾蠍虎','爬蟲','瑰寶',200,3000,1,'泉流洞的大型爬蟲，以琳琅百足為主食，與巨型走地伏翼互為競爭者。尾巴特化如錘子，數量稀少。','mt'],
['ecroc','鱷口逃生','現象','驚駭',200,0,0,'躲過埋藏於泥潭中的旱災擬岩鱷攻擊，驚險逃生。','mt'],
['erock','落井下石','現象','驚駭',150,0,0,'在大怒坡常有落石以極快的速度滾落，不小心被砸中的話半死不活。','mt'],

function qtePress(){if(S.pend!=='qte'||!qt||Date.now()<qt.lock)return;
 if(!spend(3)){qt=null;return R()}
 const p=qtePos(Date.now()-qt.t0),z=qt.zones.find(z=>Math.abs(p-z.c)<=qt.w/2);
 if(!z)return qteFall('時機偏了，一腳踩空，滑回嶽嵒峭，體力 -15。');
 if(!z.real)return qteFall('你踩進了假的落腳點，腳下一空，滑回嶽嵒峭，體力 -15。');
 qt.hits++;if(qt.hits>=qt.need){qt=null;S.place='peak';S.pend=null;log('霧氣散去，你站上了玄脈山頂峰。');return mtShow('登頂成功！','白霧在腳下散開，你站上了玄脈山頂峰。',1)}
 qtePrep();qt.msg='✔ 踩穩了！';R()}
function qteLoop(id){if(S.pend!=='qte'||!qt||qt.lid!==id)return;let v=document.getElementById('fogveil');if(!v){v=document.createElement('div');v.id='fogveil';document.body.appendChild(v)}
 const e=Date.now()-qt.t0,mk=document.getElementById('qmk');if(mk)mk.style.left=(qtePos(e)*100)+'%';v.style.opacity=qteVeil();requestAnimationFrame(()=>qteLoop(id))}
// ===== 泉流洞襲擊 =====
let qb=null;
function eyeEl(){let v=document.getElementById('blinkv');if(!v){v=document.createElement('div');v.id='blinkv';document.body.appendChild(v)}return v}
function blackOn(on){eyeEl().style.opacity=on?1:0}
function blinkFx(){const v=eyeEl();v.style.opacity=1;setTimeout(()=>{if(!(qb&&qb.phase==='black'))v.style.opacity=0},280)}
setInterval(()=>{if(S.poison>0&&!S.pend&&S.loc==='realm')blinkFx()},3000);
function centiHit(){const d=S.gear.armor?4:6;S.energy-=d;unlock('centi');S.hitMsg=`【琳琅百足】從岩縫裡竄出來咬了你一口！體力 -${d}。`;log(`⚔ 琳琅百足從岩縫竄出，咬了你一口！體力 -${d}。`);
 if(Math.random()<.55){S.poison=8;log('☠ 你中毒了！接下來 8 次行動每次多扣 3 點體力，狩獵成功率大幅下降，視線也會時不時發黑。');S.hitMsg+='　你中毒了：8 次行動內每次多扣 3 點體力，狩獵成功率大幅下降。'}}
function batStop(){if(qb){clearTimeout(qb.tm);qb.lid=-1}qb=null;try{blackOn(false)}catch(e){}const so=document.getElementById('sonar');if(so)so.remove()}
function batStart(){if(S.pend)return;unlock('bat');qb={p:0,hold:false,phase:'intro',lid:0,tm:null};S.pend='batintro';log('🦇 洞穴深處傳來尖細的聲音……');sfx('squeak');setTimeout(()=>sfx('squeak'),700);
 showFx('<div class="blk bat"><b>吱吱……</b><b class="b2">吱吱……</b></div>',2300);mtArm(2300,()=>{if(S.pend==='batintro'&&qb){S.pend='bat';qb.phase='go';batNext();R()}})}
function batNext(){clearTimeout(qb.tm);qb.tm=setTimeout(batWarn,1800+Math.random()*1700)}
function sonarFx(){const o=document.getElementById('sonar');if(o)o.remove();const d=document.createElement('div');d.id='sonar';d.innerHTML='<i></i><i></i><i></i>';document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function batWarn(){if(S.pend!=='bat'||!qb)return;qb.phase='warn';sonarFx();sfx('squeak');setTimeout(()=>sfx('squeak'),330);showFx('<div class="sq">吱吱……</div>',950);qb.tm=setTimeout(batBlack,900)}
function batBlack(){if(S.pend!=='bat'||!qb)return;qb.phase='black';blackOn(true);if(qb.hold)return batCaught();
 qb.tm=setTimeout(()=>{if(!qb)return;blackOn(false);qb.phase='go';batNext()},1500)}
function batHold(v,e){if(S.pend!=='bat'||!qb)return;if(v){if(qb.phase==='black')return batCaught();qb.hold=true;try{e&&e.target.setPointerCapture&&e.target.setPointerCapture(e.pointerId)}catch(x){}}else qb.hold=false}
function batWin(){batStop();log('🦇 你屏住呼吸，悄悄溜出了伏翼的聽力範圍。');mtShow('逃脫成功！','你輕聲細語地退出了伏翼的聽力範圍。',1)}
function batCaught(){batStop();S.energy-=20;log('⚔ 你在黑暗中被巨型走地伏翼發現了！體力 -20。');if(S.energy<=0){S.pend=null;die('你被巨型走地伏翼撲倒在洞穴裡。');R();return}mtShow('被發現了！','黑屏期間你還沒鬆手，巨型走地伏翼循著聲響撲了過來，體力 -20。',0,null,20)}
function batLoop(id,t0){if(!qb||qb.lid!==id||S.pend!=='bat')return;const now=Date.now(),dt=now-t0;if(qb.hold&&qb.phase==='go'){qb.p=Math.min(1,qb.p+dt/7000);const f=document.getElementById('batfill');if(f)f.style.width=(qb.p*100)+'%';if(qb.p>=1)return batWin()}requestAnimationFrame(()=>batLoop(id,now))}
function fogBack(){qt=null;S.pend=null;S.pend=null;S.place='cliff';log('你退回嶽嵒峭。');R()}
function mtActs(){const p=S.place,a=[],hk=!!S.gear.hook,B=(t,s,f,dis)=>a.push({t,s,f,dis});
 if(p==='gorge'){
  B('採集解氧石','體力 -6',()=>gather('oxy',6,.8));
  B('採集屍骨簇','體力 -7',()=>gather('osseo',7,.6));
  B('採集莽原旱魃草','體力 -5',()=>gather('drought',5,.9));
  B('捕捉遠行青蝗','體力 -5',()=>gather('locust',5,.6));
  B('狩獵君主大角羊','體力 -14',()=>hunt('goat',.4,14));
  B('狩獵深淵食骨鷲','體力 -16・高空獵物',()=>hunt('vulture',.15,16));
  B('探查泥潭','體力 -8・潛伏著什麼',crocProbe);
  B('狩獵旱災擬岩鱷','體力 -22・九死一生',()=>hunt('croc',.1,22));
  B('啟動傳送門返回人界','體力 -3',mtLeave)}
 if(p==='slope'){
  B('採集莽原旱魃草','體力 -5',()=>gather('drought',5,.9));
  B('狩獵君主大角羊','體力 -14',()=>hunt('goat',.4,14))}
 if(p==='cliff'){
  B('採集木茅','體力 -6',()=>gather('maoc',6,.9));
  B('開採奧古斯精鐵礦','體力 -8・下層岩壁',()=>gather('iron',8,.35));
  B('攀上岩壁開採地獄黑曜石','體力 -16・需攀岩鉤・極稀少',()=>gather('obsid',16,.12),!hk);
  B('狩獵君主大角羊','體力 -14・主要棲地',()=>hunt('goat',.5,14));
  B('狩獵匕首山貓','體力 -15',()=>hunt('dagger',.25,15));
  B('挖掘地脈石龍子','體力 -8',()=>gather('skink',8,.45));
  B('採集腐臭高山燕的排泄物','體力 -6・無法捕捉',()=>gather('swallow',6,.6));
  B('狩獵兇猛鋼刀隼','體力 -14・巢穴在絕壁',()=>hunt('falcon',.18,14));
  B('攀向玄脈山頂峰',`體力 -${mv()*2}・需攀岩鉤・白霧中校準落腳`,fogStart,!hk)}
 if(p==='peak'){
  B('採集頂點圓柏','體力 -12・稀少',()=>gather('juniper',12,.1));
  B('開採統天寶玉','體力 -16・極極稀少',()=>gather('jade',16,.015));
  B('狩獵玄脈山絲綢鳥','體力 -12',()=>hunt('silk',.2,12));
  B('採集阿貝拉多釘蟲','體力 -5',()=>gather('nail',5,.7))}
 if(p==='cave'){
  B('採集洞穴海藍水晶','體力 -12・極稀少',()=>gather('sapph',12,.12));
  B('狩獵巨型走地伏翼','體力 -18・非常難對付',()=>hunt('bat',.18,18));
  B('捕捉琳琅百足','體力 -12',()=>hunt('centi',.3,12));
  B('狩獵泰坦錘尾蠍虎','體力 -20・極稀少',()=>hunt('gecko',.07,20));
  B('潛入深潭','體力 -14・沉睡的巨獸',()=>{if(!spend(14)){R();return}if(ch(S.quake>0?.25:.03)){unlock('sal');add('sal');log('🌊 深潭泛起波紋，一道巨大的影子緩緩游過……你取得了【泉流洞大鯢】的黏液！')}else log('深潭靜得像一面鏡子。');R()})}
 return a}
function mtBar(){if(!mtIn())return '';const r=S.rain>0,hi=S.place==='cliff'||S.place==='peak';
 return `<div class="card nightbar"><b>${r?'🌧 降雨・危險度：凶險':'☀ 終年日照・危險度：侵蝕'}</b><br><span class="mute">山界沒有夜晚。向上攀爬體力消耗加倍。${hi?'<b>⚠ 氧氣稀薄：每行動 3 次體力上限 -6。</b>':''}${S.place==='gorge'?'體力低於 20 時，食骨鷲會來襲。':''}${S.place==='cave'?'洞裡的生物可能襲擊你：琳琅百足會讓你中毒，巨型走地伏翼要靜步逃脫。':''}${r?'下雨：移動多耗 20%，落石與泥潭更危險。':''}${S.quake>0?'<b>大地仍在震顫。</b>':''}</span></div>`}
function mtView(){
 if(S.pend==='mtres'&&mres){const dis=Date.now()-mres.t0<1000;return `<div class="card ${mres.ok?'':'alert'}" style="text-align:center"><h2 class="${mres.ok?'':'red'}">${mres.t}</h2>${mres.dmg?`<div class="dmg">-${mres.dmg}</div>`:''}<p>${mres.m}</p>${B('繼續','mtGo()',{c:'pri big',d:dis})}</div>`}
 if(S.pend==='rock'&&rk)return `<div class="card alert"><h2 class="red">⚠ 落石！第 ${rk.w}/${rk.n} 波</h2><p class="mtwarn" id="rkwarn">巨石正從【${rk.lanes.map(i=>LN[i]).join('、')}側】滾落！</p><p class="sub">躲向沒有落石的一側。警告很快會消失，要記住位置。越後面越快，也會同時落在兩側。被擊中會損失將近一半體力，並可能骨裂。</p><div class="tugbar mtbar" style="--d:${rockWin()/1000}s"><i></i></div><div class="grid">${LN.map((n,i)=>B('躲到'+n+'側',`rockPick(${i})`,{c:'pri big'})).join('')}</div></div>`;
 if(S.pend==='wind')return `<div class="card alert"><h2 class="red">💨 狂風！</h2><p class="mtwarn">快躲到巨石後面！</p><div class="tugbar mtbar" style="--d:1.9s"><i></i></div>${B('躲到巨石後','windHide()',{c:'pri big'})}</div>`;
 if(S.pend==='croc')return `<div class="card alert"><h2 class="red">🐊 旱災擬岩鱷！</h2><p class="mtwarn">泥潭炸開了！</p><div class="tugbar mtbar" style="--d:${S.rain>0?1.1:1.5}s"><i></i></div>${B('閃避！','crocDodge()',{c:'pri big'})}</div>`;
 if(S.pend==='batintro')return `<div class="card alert" style="text-align:center"><h2 class="red">🦇 吱吱……</h2><p class="sub">黑暗中有什麼在聽著你。</p></div>`;
 if(S.pend==='bat'&&qb){qb.lid++;const id=qb.lid;setTimeout(()=>batLoop(id,Date.now()),0);return `<div class="card alert" style="text-align:center"><h2 class="red">🦇 巨型走地伏翼</h2><p class="sub" id="batmsg">牠看不見，但聽得見。按住「靜步」悄悄離開，進度滿了就逃脫。</p><div class="tugbar"><i id="batfill" style="width:${qb.p*100}%"></i></div><button class="btn pri big" id="batbtn" style="touch-action:none;user-select:none;-webkit-user-select:none" onpointerdown="batHold(1,event)" onpointerup="batHold(0)" onpointercancel="batHold(0)" oncontextmenu="return false">按住：靜步</button></div>`}
 if(S.pend==='rockintro')return `<div class="card alert" style="text-align:center"><h2 class="red">⚠ 落石！</h2><p class="sub">山坡上方傳來隆隆巨響……</p></div>`;
 if(S.pend==='qte'&&qt){qt.lid++;const id=qt.lid;setTimeout(()=>qteLoop(id),0);return `<div class="card alert fogcard" style="text-align:center"><h2>白霧中的攀登</h2><p class="sub">只有眼前這一小塊看得清。標記進入綠色落腳點時按下「校準！」。落腳點不只一個，顏色較淡的是假的。白霧每兩秒就會吞沒一切。一步踩錯就會直接滑落。</p><p class="mtwarn" style="color:#2b3036">第 ${qt.hits+1}/${qt.need} 步</p><p class="sub" style="min-height:1.4em">${qt.msg||'&nbsp;'}</p><div class="qbar">${qt.zones.map(z=>`<div class="qz${z.real?'':' fk'}" style="left:${(z.c-qt.w/2)*100}%;width:${qt.w*100}%"></div>`).join('')}<div class="qmk" id="qmk"></div></div><div class="grid" style="margin-top:12px">${B('校準！','qtePress()',{c:'pri big'})}</div><div class="grid" style="margin-top:8px">${B('退回嶽嵒峭','fogBack()')}</div></div>`}
 S.pend=null;
 const acts=mtActs(),MV={gorge:['slope','cave'],slope:['gorge','cliff'],cliff:['slope'],cave:['gorge'],peak:['cliff']}[S.place],UP={slope:['cliff'],gorge:['slope']}[S.place]||[];
 const DS={gorge:'山界的初始地，傳送門所在。裂谷的泥潭裡潛伏著什麼，頭頂還有盤旋的食骨鷲。',slope:'通往嶽嵒峭的過渡坡地，隨時有落石滾落。',cliff:'陡峭的岩壁。需要攀岩鉤才能繼續往上。這裡的空氣已經很稀薄。',cave:'潮濕黑暗的洞穴，發光的水晶與深潭。',peak:'玄脈山頂峰，強風不斷，空氣極度稀薄。'};
 return `<div class="card"><h2>${AREAS[S.place]}</h2><p class="sub">${DS[S.place]}</p><div class="grid">${acts.map((a,i)=>B(a.t,`A(${i})`,{s:a.s,d:a.dis})).join('')}</div></div>
 <div class="card"><h3>移動</h3><div class="grid">${MV.map(k=>{const up=['slope','cliff','peak'].includes(k)&&['gorge','slope','cliff'].includes(S.place)&&(S.place==='gorge'&&k==='slope'||S.place==='slope'&&k==='cliff'),c=mv()*(up?2:1);return B(AREAS[k]+(up?' ↑':''),`goMt('${k}')`,{s:`體力 -${c}${up?'（向上，加倍）':''}`})}).join('')}</div></div>`}
function mtIntro(){return `<div class="card"><h2>山界</h2><p class="sub">危險度：侵蝕 ／ 凶險（下雨天）</p><p style="margin:0 0 8px">由連綿不絕的山脈組成，終年日照、沒有夜晚，久久才下一次雨（讓環境變得更危險）。礦產豐富，但路況崎嶇、隨時可能喪命，只能一步一步慢慢來。越往上海拔越高，空氣越稀薄，垂直向上攀爬會消耗雙倍體力。</p>
 <dl class="rd"><dt>界中地區</dt><dd>峽之間（初始生成地）、大怒坡、嶽嵒峭、泉流洞、玄脈山頂峰</dd><dt>高海拔現象：缺氧</dt><dd>爬到特定高度後，每行動三次體力上限 -6。需在上限歸零前下山，或使用氧氣瓶（三顆解氧石製成）。</dd><dt>峽之間</dt><dd>體力低於 20 時，有 30% 機率遭深淵食骨鷲攻擊（獸骨手鐲可降低機率）。</dd><dt>大怒坡</dt><dd>落石會阻撓前進，必須躲避。被擊中損失將近一半體力，40% 機率骨裂（每次行動多扣 5 點，需治療包）。</dd><dt>嶽嵒峭與頂峰</dt><dd>岩壁需要攀岩鉤。通往頂峰的路白霧瀰漫，要在霧中校準落腳點（四步，落腳點有真有假，踩錯一步就直接滑回嶽嵒峭）；頂峰強風吹起時，必須及時躲到巨石後面。</dd></dl></div>`}

const $=s=>document.querySelector(s);
load();if(S.pend==='tug'||S.pend==='tugend'||S.pend==='bat'||S.pend==='batintro'||S.pend==='rock'||S.pend==='rockintro'||S.pend==='wind'||S.pend==='croc'||S.pend==='mtres'||S.pend==='qte'||S.pend==='fog')S.pend=null;R();setInterval(()=>{if(S.jail&&S.jail<=Date.now()){R();return}if(tab==='act'&&(S.jail>Date.now()||(S.view==='shen'||S.view==='museum')&&S.loc==='home'||S.view==='town'&&S.loc==='home'&&!S.cut&&JSON.stringify(badges())!==lastSig))R()},1000);
</script>
